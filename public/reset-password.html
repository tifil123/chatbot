<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yeni Sifre Belirle</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config/supabase-config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Segoe UI, Arial, sans-serif;
      background: #0a0a0f;
      color: #e2e8f0;
    }
    .panel {
      width: 100%;
      max-width: 410px;
      background: #12121a;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    }
    h1 { font-size: 1.3rem; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: .9rem; line-height: 1.5; margin-bottom: 18px; }
    label { display: block; color: #cbd5e1; font-size: .8rem; font-weight: 700; margin-bottom: 7px; }
    input {
      width: 100%;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0a0a0f;
      color: #e2e8f0;
      padding: 12px;
      font: inherit;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: #10b981;
      color: #fff;
      padding: 12px 14px;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    .message { min-height: 22px; font-size: .85rem; margin: 12px 0; color: #fca5a5; }
    .message.ok { color: #86efac; }
    .link {
      display: block;
      color: #93c5fd;
      text-align: center;
      margin-top: 14px;
      text-decoration: none;
      font-size: .86rem;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Yeni sifre belirle</h1>
    <p>Maildeki reset linki dogrulandiysa yeni admin sifreni buradan kaydedebilirsin.</p>
    <form id="resetForm">
      <label for="password">Yeni sifre</label>
      <input id="password" type="password" autocomplete="new-password" minlength="6" required>
      <label for="passwordConfirm">Yeni sifre tekrar</label>
      <input id="passwordConfirm" type="password" autocomplete="new-password" minlength="6" required>
      <div class="message" id="message"></div>
      <button id="submitButton" type="submit">Sifreyi guncelle</button>
    </form>
    <a class="link" href="admin-panel-optimized.html">Admin paneline don</a>
  </main>

  <script>
    const config = window.SupabaseConfig?.getActiveConfig?.() || window.SupabaseConfig?.SUPABASE_CONFIG;
    const client = supabase.createClient(config.url, config.anonKey, {
      auth: {
        storageKey: 'chatbot_admin_auth',
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false
      }
    });

    const messageEl = document.getElementById('message');
    const form = document.getElementById('resetForm');
    const button = document.getElementById('submitButton');

    function setMessage(text, ok = false) {
      messageEl.textContent = text;
      messageEl.classList.toggle('ok', ok);
    }

    async function applyRecoverySession() {
      const params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');

      if (!accessToken || !refreshToken) {
        setMessage('Reset bilgisi bulunamadi. Supabase uzerinden yeni reset maili gonder.');
        button.disabled = true;
        return;
      }

      const { error } = await client.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });

      if (error) {
        setMessage('Reset oturumu acilamadi: ' + error.message);
        button.disabled = true;
        return;
      }

      window.history.replaceState({}, document.title, window.location.pathname);
      setMessage('Reset linki dogrulandi. Yeni sifreni yazabilirsin.', true);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('passwordConfirm').value;

      if (password !== passwordConfirm) {
        setMessage('Iki sifre ayni olmali.');
        return;
      }

      button.disabled = true;
      button.textContent = 'Guncelleniyor...';

      const { error } = await client.auth.updateUser({ password });
      if (error) {
        setMessage('Sifre guncellenemedi: ' + error.message);
        button.disabled = false;
        button.textContent = 'Sifreyi guncelle';
        return;
      }

      setMessage('Sifre guncellendi. Admin paneline gidebilirsin.', true);
      button.textContent = 'Guncellendi';
      setTimeout(() => window.location.href = 'admin-panel-optimized.html', 1200);
    });

    applyRecoverySession();
  </script>
</body>
</html>
